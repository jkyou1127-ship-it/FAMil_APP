# Fly.io 배포 설정 예시. `fly launch` 실행 후 app 이름/리전을 원하는 값으로 바꾸세요.
# 실제 배포 전 `fly volumes create famil_data --size 1` 로 SQLite 데이터를 보관할
# 영구 볼륨을 만들고, `fly secrets set JWT_SECRET=...` 로 비밀 값을 등록하세요
# (JWT_SECRET을 이 파일에 직접 적지 마세요 — 이 파일은 저장소에 커밋됩니다).

app = "famil-app-backend"
primary_region = "nrt"

[build]

[env]
  PORT = "4000"
  DB_PATH = "/app/data/famil.db"

[[mounts]]
  source = "famil_data"
  destination = "/app/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
