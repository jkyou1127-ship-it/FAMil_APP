name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.9"

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-apk:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: famil-app-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows:
    needs: analyze-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter build windows --release
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend production dependencies
        working-directory: backend
        run: npm ci --omit=dev
      # Bundle the Flutter app, the backend (with its Windows-built native
      # modules), and a copy of the Node.js runtime together so a single
      # double-click (FAMil_시작.bat) starts the backend and the app —
      # no separate `npm start` step required on the user's PC.
      - name: Assemble self-contained Windows bundle
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Force -Path "$dist/app" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dist/backend" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dist/node" | Out-Null

          Copy-Item -Recurse -Force "app/build/windows/x64/runner/Release/*" "$dist/app/"

          Copy-Item -Recurse -Force "backend/src" "$dist/backend/"
          Copy-Item -Recurse -Force "backend/node_modules" "$dist/backend/"
          Copy-Item -Force "backend/package.json" "$dist/backend/"
          New-Item -ItemType Directory -Force -Path "$dist/backend/data" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dist/backend/uploads/profiles" | Out-Null

          $nodeDir = Split-Path -Parent (Get-Command node).Source
          Copy-Item -Force "$nodeDir/node.exe" "$dist/node/node.exe"

          Copy-Item -Force "deploy/windows/FAMil_시작.bat" "$dist/FAMil_시작.bat"
      - uses: actions/upload-artifact@v4
        with:
          name: famil-app-windows
          path: dist/**
          if-no-files-found: error

  build-web:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      # GitHub Pages가 프로젝트 페이지(사용자/저장소 하위 경로)로 서빙하므로
      # base-href를 저장소 이름에 맞춰줘야 에셋 경로가 깨지지 않는다.
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy-web:
    if: github.ref == 'refs/heads/main'
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
